function calcSum(tekrar) {
  if (!tekrar) return "";
  const nums = tekrar.replace(/[^0-9+.,]/g, "").split("+").map(s => parseFloat(s.replace(",","."))).filter(n => !isNaN(n));
  if (nums.length === 0) return "";
  const total = nums.reduce((a, b) => a + b, 0);
  return Number.isInteger(total) ? String(total) : total.toFixed(2);
}

function genId() { return "m_" + Date.now() + "_" + Math.random().toString(36).substr(2,5); }

function loadLogs() {
  try {
    const s9 = localStorage.getItem("idman_v9");
    if (s9) return JSON.parse(s9);
    // Migrate from v7 - merge with new DEFAULT_LOGS entries
    const s8 = localStorage.getItem("idman_v8");
    const base = JSON.parse(JSON.stringify(DEFAULT_LOGS));
    if (s8) {
      const old = JSON.parse(s8);
      // Keep user's existing data, add missing DEFAULT_LOGS entries
      Object.keys(base).forEach(k => { if (!old[k]) old[k] = base[k]; });
      localStorage.setItem("idman_v9", JSON.stringify(old));
      return old;
    }
    localStorage.setItem("idman_v9", JSON.stringify(base));
    return base;
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_LOGS));
}
function saveLogs(logs) {
  try { localStorage.setItem("idman_v9", JSON.stringify(logs)); } catch(e) {}
}

                    value={selLog.idmanQeyd || ""}
                    onChange={e => updateLog(selTarix, { ...selLog, idmanQeyd: e.target.value })}
                    placeholder="İdman necə getdi? Nə çətin gəldi? Nə yaxşı getdi?..."
                    rows={3}
                    style={{ width: "100%", background: colors.inputBg, border: `1px solid ${colors.inputBorder}`,
                      color: colors.text, borderRadius: 8, padding: "10px", fontSize: 13, resize: "none", outline: "none",
                      fontFamily: "Arial, sans-serif", lineHeight: 1.6 }} />
                </div>
              </div>

              {/* Günlük */}
              <div style={{ background: D ? "#0a1a0a" : "#e8f5e9", borderRadius: 10, padding: 12, border: `1px solid ${D ? "#1a3a1a" : "#a5d6a7"}`, marginTop: 10 }}>
                <div style={{ color: D ? "#4CAF50" : "#224422", fontWeight: "bold", fontSize: 13, marginBottom: 10 }}>📖 Günlük</div>

                <div style={{ marginBottom: 10 }}>
                  <div style={{ color: colors.textMuted, fontSize: 11, marginBottom: 5 }}>⚡ Günün ümumi enerjisi:</div>
                  <div style={{ display: "flex", gap: 6 }}>
                    {[["1","😩"],["2","😕"],["3","😐"],["4","😊"],["5","🔥"]].map(([n, emoji]) => (
                      <button key={n} onClick={() => updateLog(selTarix, { ...selLog, gunEnerji: Number(n) })}
                        style={{ flex: 1, height: 44, borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: "bold",
                          background: selLog.gunEnerji === Number(n) ? "#4CAF50" : (D ? "#1a2a1a" : "#c8e6c9"),
                          color: selLog.gunEnerji === Number(n) ? "#fff" : (D ? "#aaa" : "#333") }}>
                        {emoji}<br/><span style={{fontSize:10}}>{n}/5</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div style={{ marginBottom: 10 }}>
                  <div style={{ color: colors.textMuted, fontSize: 11, marginBottom: 5 }}>😊 Günün ruh halı:</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {[["😴","Yorğun"],["😐","Orta"],["🙂","Yaxşı"],["😄","Əla"],["🔥","Möhtəşəm"]].map(([emoji, label]) => (
                      <button key={label} onClick={() => updateLog(selTarix, { ...selLog, gunRuhhal: label })}
                        style={{ padding: "5px 10px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 12,
                          background: selLog.gunRuhhal === label ? "#4CAF50" : (D ? "#1a2a1a" : "#c8e6c9"),
                          color: selLog.gunRuhhal === label ? "#fff" : (D ? "#aaa" : "#222") }}>
                        {emoji} {label}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <div style={{ color: colors.textMuted, fontSize: 11, marginBottom: 5 }}>📝 Günlük qeyd:</div>
                  <textarea
                    value={selLog.gunluk || ""}
                    onChange={e => updateLog(selTarix, { ...selLog, gunluk: e.target.value })}
                    placeholder="Bu gün necə keçdi? Nə düşündün? Nə hiss etdin?..."
                    rows={4}
                    style={{ width: "100%", background: colors.inputBg, border: `1px solid ${colors.inputBorder}`,
                      color: colors.text, borderRadius: 8, padding: "10px", fontSize: 13, resize: "none", outline: "none",
                      fontFamily: "Arial, sans-serif", lineHeight: 1.6 }} />
                </div>
              </div>


          </>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {filteredGunler.map((g) => {
          const log = getLog(g.tarix);
          const isDone = log.done;
          const hasNote = log.gunluk || log.enerji || log.ruhhal || log.agri || log.gunEnerji || log.gunRuhhal || log.idmanQeyd;
          const isSel = selTarix === g.tarix;
          return (
            <div key={g.tarix} onClick={() => setSelTarix(isSel ? null : g.tarix)}
              style={{
                background: isSel ? (D ? "#1e1e40" : "#dde8f5") : isDone ? colors.rowDone : colors.row1,
                border: `1px solid ${isSel ? colors.gold : isDone ? colors.rowBorderDone : colors.rowBorder}`,
                borderRadius: 8, padding: "8px 12px", cursor: "pointer", display: "flex", alignItems: "center", gap: 10
              }}>
              <div style={{ fontSize: 18, minWidth: 24, textAlign: "center" }}>
                {isDone ? "✅" : hasNote ? "📝" : "⬜"}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{ color: colors.textMuted, fontSize: 11 }}>{g.tarix}</span>
                  <span style={{ color: isDone ? colors.textDone : colors.text, fontSize: 13, fontWeight: "bold" }}>{g.gun}</span>
                </div>
                {(log.mesqler || []).length > 0 && (
                  <div style={{ color: colors.textMuted, fontSize: 11, marginTop: 2 }}>
                    {(log.mesqler || []).map(m => m.nov === "Digər" ? (m.novAd || "Digər") : m.nov).join(" · ")}
                    {log.muddet ? ` · ${log.muddet} dəq` : ""}
                  </div>
                )}
              </div>
              <div style={{ color: colors.textMuted, fontSize: 16 }}>›</div>
            </div>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: 10, justifyContent: "center", marginTop: 20, paddingBottom: 20, flexWrap: "wrap" }}>
        <button onClick={handleSave}
          style={{ padding: "12px 24px", fontSize: 14, fontWeight: "bold", borderRadius: 10, border: "none", cursor: "pointer",
            background: saveStatus === "saved" ? "#4CAF50" : (D ? colors.gold : "#1565c0"),
            color: "#ffffff" }}>
          {saveStatus === "saved" ? "✅ Saxlanıldı!" : "💾 Saxla"}
        </button>
        <button onClick={handleExport}
          style={{ padding: "12px 24px", fontSize: 14, fontWeight: "bold", borderRadius: 10, cursor: "pointer",
            background: copyStatus === "copied" ? "#5B9BD5" : colors.statBg,
            color: copyStatus === "copied" ? "#fff" : "#5B9BD5",
            border: "1px solid #5B9BD5" }}>
          {copyStatus === "copied" ? "✅ Kopyalandı!" : "📋 Kloda paylaş"}
        </button>
        <button onClick={handleBackup}
          style={{ padding: "12px 24px", fontSize: 14, fontWeight: "bold", borderRadius: 10, cursor: "pointer",
            background: D ? "#1a2a1a" : "#e8f5e9", color: "#4CAF50", border: "1px solid #4CAF50" }}>
          📥 Yedəklə
        </button>
        <button onClick={handleRestore}
          style={{ padding: "12px 24px", fontSize: 14, fontWeight: "bold", borderRadius: 10, cursor: "pointer",
            background: D ? "#2a1a1a" : "#fff3e0", color: "#FF9800", border: "1px solid #FF9800" }}>
          📤 Bərpa et
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
